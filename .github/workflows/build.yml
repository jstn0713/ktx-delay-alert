name: 앱 빌드 (APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: 서명 키 준비
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "HAS_SIGNING_KEY=true" >> "$GITHUB_ENV"
          else
            echo "::warning::서명 키 Secret(KEYSTORE_BASE64, KEYSTORE_PASSWORD)이 없어 임시 키로 빌드만 합니다. 다운로드 페이지(릴리스)에는 올리지 않습니다."
          fi

      - name: 테스트
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: APK 빌드
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease -PversionCode=${{ github.run_number }}

      - name: 파일 이름 정리
        run: cp app/build/outputs/apk/release/app-release.apk ktx-delay-alert.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ktx-delay-alert-apk
          path: ktx-delay-alert.apk

      - name: 다운로드 페이지(릴리스)에 올리기
        if: github.ref == 'refs/heads/main' && env.HAS_SIGNING_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" ktx-delay-alert.apk \
            --title "KTX 지연 알림 v1.0.${{ github.run_number }}" \
            --notes "${NOTES:-새 버전}" \
            --latest
