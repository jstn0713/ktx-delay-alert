name: 앱 빌드 (APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 서명 키 준비
        env:
          SIGNING_SEED: ${{ secrets.SIGNING_SEED }}
        run: |
          if [ -n "$SIGNING_SEED" ]; then
            pip install --quiet pycryptodome==3.21.0 cryptography==44.0.0
            python .github/scripts/make_keystore.py "$RUNNER_TEMP/release.p12"
            echo "HAS_SIGNING_KEY=true" >> "$GITHUB_ENV"
          else
            echo "::warning::SIGNING_SEED Secret이 없어 임시 키로 빌드만 합니다. 다운로드 페이지(릴리스)에는 올리지 않습니다."
          fi

      - name: 테스트
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: APK 빌드
        run: ./gradlew --no-daemon assembleRelease -PversionCode=${{ github.run_number }}

      - name: 파일 이름 정리
        run: cp app/build/outputs/apk/release/app-release.apk ktx-delay-alert.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ktx-delay-alert-apk
          path: ktx-delay-alert.apk

      - name: 다운로드 페이지(릴리스)에 올리기
        if: github.ref == 'refs/heads/main' && env.HAS_SIGNING_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" ktx-delay-alert.apk \
            --title "KTX 지연 알림 v1.0.${{ github.run_number }}" \
            --notes "${NOTES:-새 버전}" \
            --latest
